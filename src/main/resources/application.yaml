spring:
  application:
    name: tournament_api
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  server:
    port: 8080

jwt:
  secret: ${JWT_SECRET}
  accessTokenValidity: 900
  refreshTokenValidity: 604800
